   <g id="text_12">
    <text style="font-size: 7.7px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(395.585272 291.118476)">Analytic Auxiliary Elimination:</text>
    <text style="font-size: 7.7px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(361.746178 300.618411)">  min_y x^T Q x = z^T Q_zz z + sum min(0, ...)</text>
