   <g id="text_3">
    <text style="font-weight: 700; font-size: 9.3px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="161.208" y="78.775713" transform="rotate(-0 161.208 78.775713)">Model 3A-Comp (Zero-Aux Bipartite)</text>
   </g>
   <g id="text_4">
    <text style="font-size: 7.7px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(79.719742 114.239067)">Composite Site u_{ik} for active (A_i, X_k)</text>
    <text style="font-size: 7.7px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(106.304594 123.953158)">B-site indicator b_j (one-hot)</text>
    <text style="font-size: 7.7px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(85.292016 133.667249)">Exact 3-body lookup: T_bar(u_{ik}, b_j)</text>
    <text style="font-size: 7.7px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(87.080461 143.381341)">0 auxiliary variables (strict y=a*c N/A)</text>
    <text style="font-size: 7.7px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(91.755805 152.926754)">Blind 12: 18 spins | Full 08: 26 spins</text>
    <text style="font-size: 7.7px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(87.780078 162.686324)">Illegal GS = 0 | Top-1 Regret = 0.0000</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 9.3px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="453.1536" y="78.739385" transform="rotate(-0 453.1536 78.739385)">Model 3A-HOBO (Asym. A-X Reduction)</text>
   </g>
   <g id="text_6">
    <text style="font-size: 7.7px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(372.774022 114.362988)">Product Gadget y_{ik} = a_i * c_k (|X|=3)</text>
    <text style="font-size: 7.7px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(369.799295 124.122558)">Cumulative Bound: P_aux &gt; sum_j |c_{ijk}|</text>
    <text style="font-size: 7.7px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(369.857647 133.836649)">One-Hot Block Penalty P_block &gt; 1.5 C_cap</text>
    <text style="font-size: 7.7px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(374.457194 143.596219)">Blind 12: 29 spins (11 aux) | Full: 43 (18)</text>
    <text style="font-size: 7.7px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(377.708639 153.31031)">Analytic y-elim + 2^n cert: 0 illegal GS</text>
    <text style="font-size: 7.7px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(374.343498 162.810245)">Hardware checks BOTH primary &amp; y=a*c</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 9.3px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="745.992" y="78.775713" transform="rotate(-0 745.992 78.775713)">Model 3B-ANOVA (2nd-Order Compact)</text>
   </g>
   <g id="text_8">
    <text style="font-size: 7.7px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(658.979594 114.475962)">ANOVA Decomposition: mu + f_A + f_B + f_X</text>
    <text style="font-size: 7.7px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(663.777055 124.190053)">  + f_{AB} + f_{AX} + f_{BX} (no 3-body)</text>
    <text style="font-size: 7.7px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(666.455211 133.904145)">Uniform 8x Scaling across diag &amp; off-diag</text>
    <text style="font-size: 7.7px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(676.539805 143.449558)">Blind 12: 25 spins | Full 08: 33 spins</text>
    <text style="font-size: 7.7px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(671.393438 153.163649)">Non-degenerate: 6 distinct legal levels</text>
    <text style="font-size: 7.7px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(675.568883 162.663584)">Explicit 3-Layer Error Decomposition</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 9.6px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="453.6" y="225.568457" transform="rotate(-0 453.6 225.568457)">Exact Section 9.2 QUBO-to-Ising Mapping &amp; SPQC-550 Int8 Dynamic-Range Gate</text>
   </g>
   <g id="text_10">
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(252.799938 256.317587)">Binary-to-Spin:  x_i = (1 + s_i * s_ref) / 2,   s_i, s_ref in {-1, +1}   |   Minimization:  E(s) = -s^T H s</text>
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(197.205859 266.662464)">Exact Couplings:  H_{ij} = -Q_{ij}/4 (i != j),   H_{i,ref} = -(1/4) sum_j Q_{ij},   H_{ii} = 0,   C = (1/4)(sum_{ij} Q_{ij} + tr Q)</text>
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(231.474172 277.00734)">Identity:  x^T Q x = -s^T H s + C   (Bit-exact int64 matrix SHA-256 &amp; energy diff = 0 across all test vectors)</text>
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(242.713297 287.124154)">Hardware Gate:  H in Z^{N x N},  H = H^T,  diag(H) = 0,  N &lt;= 550,  H_{ij} in [-127, 127] (&lt;= 8 bits)</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 9.3px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="237.096" y="349.358395" transform="rotate(-0 237.096 349.358395)">Global Ground-State Certification (Offline Exact)</text>
   </g>
   <g id="text_12">
    <text style="font-size: 7.7px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(58.17507 385.489158)">1. Analytic y-elimination: min_y x^T Q x = z^T Q_zz z + sum_r min(0, Q_rr + 2 z^T Q_{z,r})</text>
    <text style="font-size: 7.7px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(86.043055 395.203249)">2. Exhaustive primary enumeration (2^n vectorized or cardinality-partitioned)</text>
    <text style="font-size: 7.7px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(81.683531 404.703184)">3. Certifies: illegal_ground_count = 0 &amp; illegal_aux_tie_count = 0 (all 8 matrices)</text>
    <text style="font-size: 7.7px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(73.938414 414.417276)">4. Records cert_min_ising_energy (-1000, -1468, -1662, -1992), degeneracy &amp; regret</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 9.3px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="670.104" y="349.358395" transform="rotate(-0 670.104 349.358395)">Classical SA/Tabu &amp; SPQC-550 Hardware Decode</text>
   </g>
   <g id="text_14">
    <text style="font-size: 7.7px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(528.229695 385.596236)">1. Sort returned spins s by E(s) = -s^T H s (fixes unsorted SA heap order)</text>
    <text style="font-size: 7.7px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(534.469102 395.096171)">2. Decode x = ((s[:-1] * s[-1]) + 1) // 2 and audit 3 independent gates:</text>
    <text style="font-size: 7.7px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(507.489023 404.596106)">     one-hot (k_A=k_B=k_X=1)  •  pool &amp; A != B  •  aux consistency (y_ik = a_i * c_k)</text>
    <text style="font-size: 7.7px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(496.982133 414.310197)">3. Separate unique feasible candidates vs duplicate shots; track cloud_roundtrip_wall_sec</text>
   </g>
